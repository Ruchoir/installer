[package]
name = "ruchoir-install"
version = "0.1.0"
description = "Sets up a self-hosted Ruchoir instance: its manifest, secrets, keys, the clients Propolis knows, and the compose file that runs it."
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/Ruchoir/installer"
publish = false

[[bin]]
name = "ruchoir-install"
path = "src/main.rs"

[lib]
name = "ruchoir_install"
path = "src/lib.rs"

[dependencies]
# The command line (clap-rs community, MIT/Apache-2.0).
clap = { version = "4.6.7", features = ["derive"] }
# The manifest and the files Propolis and the hub read (serde community, MIT/Apache-2.0).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The client registry and the subscriptions, in TOML (toml-rs community, MIT/Apache-2.0).
toml = "1.2.1"
# Ed25519 keys for each service, in PEM (Frank Denis, France; ISC), as the services read them.
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
# Secrets from the operating system's generator (rust-random community, MIT/Apache-2.0).
getrandom = "0.4.3"
# The public half of a key, in a JWK (Marshall Pierce, community, MIT/Apache-2.0).
base64 = "0.23.1"
# The development certificate authority (rustls project, MIT/Apache-2.0), with ring rather than AWS
# aws-lc-rs, as everywhere else.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }

# `migrate`, which carries a monolith instance's data over (src/migrate):
# its runtime (tokio project, community, MIT),
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time"] }
# the PostgreSQL client it reads and writes with (rust-postgres, community, MIT/Apache-2.0),
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
# the secrets kept encrypted at rest, opened with the monolith's key and closed with the new one
# (RustCrypto, community, MIT/Apache-2.0),
aes-gcm = "0.11.1"
# the VAPID key, written as the PEM the hub reads (RustCrypto, community, MIT/Apache-2.0),
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std", "pkcs8", "pem"] }
# the ids made for the files a product now holds, the same on every run (uuid-rs, community,
# MIT/Apache-2.0),
uuid = { version = "1.29.2", features = ["v4", "v5", "serde"] }
# the drive's object store, over S3 on the loopback (rust-s3, community, MIT; as the drive uses it,
# without TLS),
rust-s3 = { version = "0.38.0", default-features = false, features = ["with-tokio", "fail-on-err"] }

[dev-dependencies]
# A throwaway instance directory per test (Stebalien and community, MIT/Apache-2.0).
tempfile = "3.27.0"
